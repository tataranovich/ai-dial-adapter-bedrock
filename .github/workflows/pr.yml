name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: tataranovich/ai-dial-ci/.github/workflows/python_docker_pr.yml@main
    secrets: inherit
    with:
      python-version: 3.11
      poetry-version: 2.1.1
      platforms: "linux/amd64,linux/arm64"
      trivy-severity: "CRITICAL,HIGH,MEDIUM,LOW"
      trivy-severity-for-sarif: "CRITICAL,HIGH,MEDIUM,LOW"
      ort-enabled: false
      code-checks-enabled: false
